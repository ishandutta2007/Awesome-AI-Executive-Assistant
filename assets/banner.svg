<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="pulse-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
      .glow-orb-1 {
        animation: pulse1 7s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulse2 9s ease-in-out infinite alternate;
      }
      .data-stream {
        stroke-dasharray: 8, 8;
        animation: dash 12s linear infinite;
      }
      .float-node {
        animation: float 4s ease-in-out infinite alternate;
      }
      .float-node-2 {
        animation: float 5s ease-in-out infinite alternate-reverse;
      }
      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.25) translate(40px, 20px); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.3) translate(-30px, -20px); opacity: 0.6; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Technical Grid overlay in Background -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="blur(55px)">
    <circle class="glow-orb-1" cx="220" cy="130" r="170" fill="url(#cyan-glow)" />
    <circle class="glow-orb-2" cx="980" cy="270" r="190" fill="url(#purple-glow)" />
  </g>

  <!-- Dynamic Animated Tech Circuit Lines (Always Behind Foreground Content) -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5">
    <path class="data-stream" d="M 50 80 Q 300 20 600 80 T 1150 70" />
    <path class="data-stream" d="M 50 350 Q 400 390 750 330 T 1150 360" />
    <line x1="160" y1="40" x2="160" y2="380" stroke="#334155" stroke-opacity="0.4" stroke-dasharray="4,6" />
    <line x1="1040" y1="40" x2="1040" y2="380" stroke="#334155" stroke-opacity="0.4" stroke-dasharray="4,6" />
  </g>

  <!-- Subtle Floating Accent Badges on Edges -->
  <g class="float-node" transform="translate(80, 50)">
    <rect width="110" height="32" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text" fill="#94a3b8">AUTONOMOUS</text>
  </g>

  <g class="float-node-2" transform="translate(1010, 48)">
    <rect width="115" height="32" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#c084fc">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text" fill="#94a3b8">AGENTIC-AI</text>
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, Highlights -->
  <g id="foreground-content">
    <!-- Icon/Badge Header -->
    <g transform="translate(600, 95)" text-anchor="middle">
      <rect x="-135" y="-18" width="270" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text y="5" class="badge-text" fill="#38bdf8" font-size="13">⚡ THE CURATED INDEX FOR 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="170" text-anchor="middle" class="title-text" fill="url(#title-grad)">
      Awesome AI Executive Assistant
    </text>

    <!-- Subtitle -->
    <text x="600" y="212" text-anchor="middle" class="subtitle-text">
      Autonomous Scheduling, Calendar Optimization, Inbox Triage &amp; Executive Agent Workflows
    </text>

    <!-- Feature Pill Row in Foreground -->
    <g transform="translate(600, 260)" text-anchor="middle">
      <!-- Pill 1 -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="160" height="42" rx="21" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <text x="80" y="26" class="badge-text" fill="#e2e8f0" text-anchor="middle">🗓️ Smart Calendar</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="160" height="42" rx="21" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <text x="80" y="26" class="badge-text" fill="#e2e8f0" text-anchor="middle">📥 Inbox Zero Agent</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <text x="90" y="26" class="badge-text" fill="#e2e8f0" text-anchor="middle">💼 Executive Operations</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="160" height="42" rx="21" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <text x="80" y="26" class="badge-text" fill="#e2e8f0" text-anchor="middle">🔓 Open-Source Hub</text>
      </g>
    </g>

    <!-- Metrics Strip / Subtext -->
    <g transform="translate(600, 345)" text-anchor="middle">
      <rect x="-320" y="-16" width="640" height="32" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text y="5" class="badge-text" fill="#94a3b8">
        📊 SaaS Valuations &amp; ARR &nbsp;|&nbsp; 💰 Transparent Pricing &nbsp;|&nbsp; 🌟 Open-Source Stargazers
      </text>
    </g>
  </g>
</svg>